# Publish the app on GitHub Pages, with the snow forecast, avalanche bulletins and measured snow for every resort
# fetched once for all users. Runs on every push to main, and the schedule refreshes the data about every 3 hours.
# GitHub delays and skips scheduled runs, so the schedule fires every hour and the check job lets a run through
# only when the published data is older than 2.5 hours. Open-Meteo calls stay the same as with a 3-hour schedule.
# The data files are published with the app but never committed, so the repo does not grow.
# Needs Settings → Pages → Source: "GitHub Actions".
name: Publicera appen

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      - id: age
        name: Är den publicerade datan gammal nog?
        # -L follows GitHub's redirect from the github.io address to the custom domain
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          at=$(curl -sSfL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/snow/japan.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["at"])' || echo "")
          age=$(python3 -c 'import sys,datetime as d; a=sys.argv[1]; print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(a.replace("Z","+00:00"))).total_seconds()) if a else 999999)' "$at")
          echo "Datan hämtades $at, $((age/60)) minuter sedan."
          if [ "$age" -ge 9000 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Hämta snödata för alla orter
        run: |
          mkdir -p data/snow
          # Start from the published files, so an area whose fetch fails keeps its last forecast
          for area in japan scandinavia alps; do
            curl -sSf "${{ steps.pages.outputs.base_url }}/data/snow/$area.json" -o "data/snow/$area.json" || rm -f "data/snow/$area.json"
          done
          python3 tools/fetch_snow.py index.html data/snow
      - name: Hämta lavinprognoser för alla orter
        run: |
          mkdir -p data/avalanche
          # Start from the published files, so a source that fails keeps its last bulletins
          for area in japan scandinavia alps; do
            curl -sSf "${{ steps.pages.outputs.base_url }}/data/avalanche/$area.json" -o "data/avalanche/$area.json" || rm -f "data/avalanche/$area.json"
          done
          python3 tools/fetch_avalanche.py index.html data/avalanche || echo "Lavinhämtningen misslyckades, behåller de senast publicerade filerna."
      - name: Hämta uppmätt snö från mätstationer
        env:
          FROST_CLIENT_ID: ${{ secrets.FROST_CLIENT_ID }}
        run: |
          mkdir -p data/obs
          # Start from the published files: they hold the history that JMA and SLF only give for a short time
          for area in japan scandinavia alps; do
            curl -sSf "${{ steps.pages.outputs.base_url }}/data/obs/$area.json" -o "data/obs/$area.json" || rm -f "data/obs/$area.json"
          done
          python3 tools/fetch_obs.py index.html data/obs || echo "Hämtningen av mätvärden misslyckades, behåller de senast publicerade filerna."
      - name: Hämta webbkameror vid backarna (en gång om dygnet)
        env:
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
        run: |
          mkdir -p data/cams
          # Start from the published files; the script only asks Windy again when they are 20 hours old
          for area in japan scandinavia alps; do
            curl -sSf "${{ steps.pages.outputs.base_url }}/data/cams/$area.json" -o "data/cams/$area.json" || rm -f "data/cams/$area.json"
          done
          python3 tools/fetch_cams.py index.html data/osm/places data/cams || echo "Hämtningen av webbkameror misslyckades, behåller de senast publicerade filerna."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub Pages sometimes fails with a temporary error, so wait a minute and try once more
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Vänta innan nytt försök
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
